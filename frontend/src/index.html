<body>
  <!-- Fondo animado con gráficas financieras -->
  <div class="background-charts">
    <svg class="chart-line" viewBox="0 0 1200 800" preserveAspectRatio="none">

    <svg class="chart-line-secondary" viewBox="0 0 1200 800" preserveAspectRatio="none">
      <path class="animated-path-delayed" d="M0,700 Q400,500 800,600 T1200,400" fill="none" stroke="var(--color-navy-lighter)" stroke-width="1.5" opacity="0.6" />
    </svg>
  </div>
