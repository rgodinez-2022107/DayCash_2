<div class="page-container">
  <div class="page-header">
    <span class="section-tag">ANÁLISIS</span>
    <h1>Estadísticas</h1>
    <p class="page-subtitle">Resumen del flujo de dinero del mes actual.</p>
  </div>

  <!-- Tarjetas superiores de métricas -->
  <div class="metrics-grid">
    <div class="metric-card">
      <span class="metric-label">Dinero Restante</span>
      <strong class="metric-value balance">{{ formatMoney(monthlyStats.monthlyRestante()) }}</strong>
      <small class="metric-sub">Este mes</small>
    </div>
    <div class="metric-card">
      <span class="metric-label">Total Gastado</span>
      <strong class="metric-value expense">{{ formatMoney(monthlyStats.monthlyGastado()) }}</strong>
      <small class="metric-sub">Este mes</small>
    </div>
  </div>

  <!-- Gráficas: gastos por categoría (barras) y pastel lado a lado -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3 class="chart-title">Gastos por Categoría</h3>
      <div class="chart-canvas-wrap">
        <app-monthly-flow-chart [items]="monthlyStats.expenseByCategory()"></app-monthly-flow-chart>
      </div>
    </div>
    <div class="chart-card">
      <h3 class="chart-title">Pagos por Método</h3>
      <div class="chart-canvas-wrap">
        <app-expense-pie-chart [data]="monthlyStats.expenseByPaymentMethod()"></app-expense-pie-chart>
      </div>
    </div>
  </div>
</div>
